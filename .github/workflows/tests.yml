name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c constraints.txt . build twine
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed package outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          caims --help
          caims paper-config --dataset scifact --output paper-config.json
          python -c "from caims.reference import paper_configuration; assert paper_configuration('scifact')['t_select'] == 80"
